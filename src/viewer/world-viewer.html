<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>World Map Viewer</title>
  <style>
    :root {
      --bg: #0e1117;
      --panel: #171b23;
      --border: #2a2f3a;
      --accent: #5ac8fa;
      --text: #e7ebf5;
      --muted: #9ba4b5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 10px 14px;
      background: #10141c;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      background: #1f2430;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    button:hover {
      background: #242a38;
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    #status {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 12px;
      padding: 12px;
      overflow: hidden;
    }

    #controlsPanel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: auto;
    }

    #controlsPanel h2 {
      margin: 0;
      font-size: 15px;
      letter-spacing: 0.2px;
    }

    .control-section {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      background: #131823;
    }

    .section-title {
      margin: 0 0 8px 0;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
    }

    .control-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .control-row label {
      font-size: 13px;
      color: #dce2ef;
      display: block;
    }

    .control-inputs {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .control-inputs input[type="range"] {
      accent-color: var(--accent);
      width: 140px;
    }

    .control-inputs input[type="number"] {
      width: 76px;
      background: #0f121a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 6px;
      border-radius: 6px;
    }

    .seed-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #seedInput {
      flex: 1;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0f121a;
      color: var(--text);
    }

    #applyConfigBtn {
      background: linear-gradient(135deg, #4ca3ff, #5ac8fa);
      color: #0b0e14;
      font-weight: 600;
      border: none;
    }

    #viewerArea {
      background: #090c12;
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
      overflow: hidden;
    }

    #canvasWrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
    }

    canvas {
      image-rendering: pixelated;
      border: 1px solid #2c3340;
      max-width: 100%;
      max-height: calc(100vh - 180px);
      background: #0b0f18;
    }

    .legend {
      font-size: 11px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0f121a;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .swatch {
      width: 10px;
      height: 10px;
      display: inline-block;
      border-radius: 2px;
    }

    @media (max-width: 1100px) {
      main {
        grid-template-columns: 1fr;
      }

      #controlsPanel {
        max-height: 40vh;
      }
    }
  </style>
</head>

<body>
  <header>
    <button id="renderCompositeBtn">Composite Map</button>
    <button id="renderBiomeBtn">Biome Map</button>
    <button id="renderHeightBtn">Height Map</button>
    <button id="applyConfigBtn">Render lại với config</button>
    <button id="saveConfigBtn">Save JSON</button>
    <span id="status">idle</span>
  </header>
  <main>
    <aside id="controlsPanel">
      <h2>Tuning worldGenConfig</h2>
      <div class="control-section">
        <p class="section-title">Seed</p>
        <div class="seed-row">
          <input id="seedInput" placeholder="seed..." />
          <button id="randomSeedBtn" title="Random seed">🎲</button>
        </div>
      </div>

      <div class="control-section">
        <p class="section-title">Continents</p>
        <div id="continentsControls"></div>
      </div>

      <div class="control-section">
        <p class="section-title">Elevation</p>
        <div id="elevationControls"></div>
      </div>

      <div class="control-section">
        <p class="section-title">Biomes</p>
        <div id="biomeControls"></div>
      </div>
    </aside>
    <section id="viewerArea">
      <div id="canvasWrapper">
        <canvas id="canvas"></canvas>
      </div>
      <div class="legend">
        <span><span class="swatch" style="background:#041844"></span>deep ocean</span>
        <span><span class="swatch" style="background:#062c68"></span>mid ocean</span>
        <span><span class="swatch" style="background:#2a76aa"></span>coastal water</span>
        <span><span class="swatch" style="background:#7dcae6"></span>shore water</span>
        <span><span class="swatch" style="background:#dacc8c"></span>beach</span>
        <span><span class="swatch" style="background:#d3824e"></span>desert</span>
        <span><span class="swatch" style="background:#cca75e"></span>semi-arid scrub</span>
        <span><span class="swatch" style="background:#c2b460"></span>savanna</span>
        <span><span class="swatch" style="background:#86a850"></span>grassland</span>
        <span><span class="swatch" style="background:#63924c"></span>temperate forest</span>
        <span><span class="swatch" style="background:#4c7a45"></span>tropical forest</span>
        <span><span class="swatch" style="background:#3c673e"></span>rainforest</span>
        <span><span class="swatch" style="background:#57785d"></span>taiga</span>
        <span><span class="swatch" style="background:#b2b199"></span>tundra</span>
        <span><span class="swatch" style="background:#7a7463"></span>rocky mountain</span>
        <span><span class="swatch" style="background:#8b826f"></span>mountain range</span>
        <span><span class="swatch" style="background:#e9e9e8"></span>alpine snow</span>
        <span><span class="swatch" style="background:#d6d1c6"></span>high peak</span>
        <span><span class="swatch" style="background:#60a08c"></span>wetlands</span>
        <span><span class="swatch" style="background:#7dc6f0"></span>river</span>
      </div>
    </section>
  </main>

  <script type="module" src="./worldViewer.js?v=4"></script>
</body>

</html>
